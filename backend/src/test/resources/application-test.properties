# Overrides for the integration-test profile: runs against a dedicated test
# database (created on demand by TestDatabaseInitializer) so local dev data
# and CI are never touched.
spring.datasource.url=jdbc:postgresql://localhost:5432/developershub_test
spring.datasource.username=devuser
spring.datasource.password=devpass

# Rate limits are exercised directly by RateLimitApiTests; other tests stay
# under these bounds because the limiter is reset before every test method.
app.rate-limit.login.max=5
app.rate-limit.register.max=10
app.rate-limit.bootstrap.max=3
