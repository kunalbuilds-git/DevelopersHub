spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/developershub}
spring.datasource.username=${DB_USERNAME:devuser}
spring.datasource.password=${DB_PASSWORD:devpass}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# HMAC key for signing JWTs - REQUIRED in production, must be at least 32 bytes.
# When blank (local dev), an ephemeral random secret is generated at startup.
jwt.secret=${JWT_SECRET:}
# Access tokens are short-lived by design; the refresh token is the long-lived credential.
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Refresh-token lifetime in days.
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}

# One-time setup token that lets the first account claim the ADMIN role via
# POST /api/auth/admin/bootstrap. Unset (default) disables the endpoint.
# Leave unset after the first admin exists - the endpoint refuses to run then anyway.
app.admin.setup-token=${ADMIN_SETUP_TOKEN:}

# Sliding-window rate limits on the auth endpoints, per client IP.
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.login.max=${RATE_LIMIT_LOGIN_MAX:10}
app.rate-limit.register.max=${RATE_LIMIT_REGISTER_MAX:5}
app.rate-limit.bootstrap.max=${RATE_LIMIT_BOOTSTRAP_MAX:3}

# Comma-separated list of origins allowed to call the API from a browser, e.g. http://localhost:3000
# Empty (default) disables CORS entirely.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
