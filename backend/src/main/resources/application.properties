spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/developershub}
spring.datasource.username=${DB_USERNAME:devuser}
spring.datasource.password=${DB_PASSWORD:devpass}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# HMAC key for signing JWTs - REQUIRED in production, must be at least 32 bytes.
# When blank (local dev), an ephemeral random secret is generated at startup.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated list of origins allowed to call the API from a browser, e.g. http://localhost:3000
# Empty (default) disables CORS entirely.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
