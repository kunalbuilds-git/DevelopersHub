server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its own routing, so unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser bundle calls the API on the same origin, so /api is proxied
    # to the API container instead of being served from disk.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build assets are content-hashed and therefore safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell must never be cached, or clients keep loading an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
